services:
  - type: web
    name: mkulima-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CLIMATEENGINE_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
